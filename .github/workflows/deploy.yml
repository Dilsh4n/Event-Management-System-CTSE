# ─────────────────────────────────────────────────────────────────────────────
# GitHub Actions CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# WHAT THIS PIPELINE DOES:
# ─────────────────────────
# Two trigger modes:
#
# A) ON PUSH / PR  → runs unit tests only (no build, no deploy)
#    This validates code on every push without touching production.
#
# B) MANUAL RUN (workflow_dispatch) → runs tests, builds selected services,
#    pushes to ECR, and deploys to EC2. You choose WHICH services to build
#    using checkboxes in the GitHub Actions UI.
#
# WHY MANUAL DEPLOY?
# ───────────────────
# Automatic deploy on every push can be risky and wastes build minutes.
# With manual dispatch you can:
#   - Push many commits to main without triggering deploys
#   - Deploy only when you're ready (after code review, testing, etc.)
#   - Choose to build/deploy only the services you changed (saves time)
#   - Deploy all services at once if needed
#
# PREREQUISITES:
# ──────────────
# Set these secrets in GitHub → Settings → Secrets → Actions:
#   AWS_ACCESS_KEY_ID       - IAM user access key
#   AWS_SECRET_ACCESS_KEY   - IAM user secret key
#   AWS_REGION              - e.g., ap-southeast-1
#   AWS_ACCOUNT_ID          - 12-digit AWS account ID
#   EC2_HOST                - Elastic IP of EC2 instance
#   EC2_SSH_KEY             - Contents of the .pem file
#   EC2_USERNAME            - ec2-user (for Amazon Linux)
#
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD Pipeline — Build, Push & Deploy

# ─── TRIGGERS ─────────────────────────────────────────────────────────────────
on:
  # TRIGGER 1: Automatic — runs tests on every push/PR (does NOT deploy)
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # TRIGGER 2: Manual — click "Run workflow" in GitHub Actions UI
  # You get a form with checkboxes to select which services to build & deploy
  workflow_dispatch:
    inputs:
      deploy_user_service:
        description: 'Build & deploy user-service'
        required: false
        type: boolean
        default: true
      deploy_event_service:
        description: 'Build & deploy event-service'
        required: false
        type: boolean
        default: true
      deploy_registration_service:
        description: 'Build & deploy registration-service'
        required: false
        type: boolean
        default: true
      deploy_notification_service:
        description: 'Build & deploy notification-service'
        required: false
        type: boolean
        default: true
      deploy_frontend:
        description: 'Build & deploy frontend'
        required: false
        type: boolean
        default: true

# ─── ENVIRONMENT VARIABLES ────────────────────────────────────────────────────
# Available to all jobs in this workflow
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

# ─── JOBS ─────────────────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: TEST — Run unit tests for all backend services
  # ═══════════════════════════════════════════════════════════════════════════
  # Runs on EVERY trigger: push, pull_request, and manual dispatch
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - event-service
          - registration-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests — ${{ matrix.service }}
        run: mvn test -B -f ${{ matrix.service }}/pom.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: BUILD — Build Docker images & push to ECR
  # ═══════════════════════════════════════════════════════════════════════════
  # ONLY runs on manual dispatch (workflow_dispatch) — NOT on push/PR
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ─── Conditional builds: only build services that were selected ───
      - name: Build & Push — user-service
        if: ${{ inputs.deploy_user_service }}
        run: |
          echo "→ Building user-service..."
          docker build -t $ECR_REGISTRY/event-mgmt/user-service:latest \
                        -t $ECR_REGISTRY/event-mgmt/user-service:${{ github.sha }} \
                        ./user-service
          docker push $ECR_REGISTRY/event-mgmt/user-service --all-tags

      - name: Build & Push — event-service
        if: ${{ inputs.deploy_event_service }}
        run: |
          echo "→ Building event-service..."
          docker build -t $ECR_REGISTRY/event-mgmt/event-service:latest \
                        -t $ECR_REGISTRY/event-mgmt/event-service:${{ github.sha }} \
                        ./event-service
          docker push $ECR_REGISTRY/event-mgmt/event-service --all-tags

      - name: Build & Push — registration-service
        if: ${{ inputs.deploy_registration_service }}
        run: |
          echo "→ Building registration-service..."
          docker build -t $ECR_REGISTRY/event-mgmt/registration-service:latest \
                        -t $ECR_REGISTRY/event-mgmt/registration-service:${{ github.sha }} \
                        ./registration-service
          docker push $ECR_REGISTRY/event-mgmt/registration-service --all-tags

      - name: Build & Push — notification-service
        if: ${{ inputs.deploy_notification_service }}
        run: |
          echo "→ Building notification-service..."
          docker build -t $ECR_REGISTRY/event-mgmt/notification-service:latest \
                        -t $ECR_REGISTRY/event-mgmt/notification-service:${{ github.sha }} \
                        ./notification-service
          docker push $ECR_REGISTRY/event-mgmt/notification-service --all-tags

      - name: Build & Push — frontend
        if: ${{ inputs.deploy_frontend }}
        run: |
          echo "→ Building frontend..."
          docker build -t $ECR_REGISTRY/event-mgmt/frontend:latest \
                        -t $ECR_REGISTRY/event-mgmt/frontend:${{ github.sha }} \
                        ./frontend
          docker push $ECR_REGISTRY/event-mgmt/frontend --all-tags

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: DEPLOY — SSH into EC2 and update running containers
  # ═══════════════════════════════════════════════════════════════════════════
  # ONLY runs on manual dispatch — after build-and-push completes
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Copy the latest docker-compose.prod.yml to EC2
      - name: Copy compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/event-mgmt/"

      # SSH into EC2, pull only the updated images, and restart
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            echo "═══ Deploying to EC2 ═══"

            cd ~/event-mgmt

            # Source environment variables
            export $(grep -v '^#' .env | xargs)

            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

            # Pull latest images
            echo "→ Pulling latest images..."
            docker compose -f docker-compose.prod.yml pull

            # Restart with new images (--force-recreate ensures old containers are replaced)
            echo "→ Restarting services..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            # Clean up old dangling images to save disk space
            echo "→ Cleaning up..."
            docker image prune -f

            # Show final status
            echo "→ Deployment complete!"
            docker compose -f docker-compose.prod.yml ps
