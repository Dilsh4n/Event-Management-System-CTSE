name: Deploy Full Stack to EC2 Production

on:
  push:
    branches:
      - production

jobs:
  # ---------------------------------------------------
  # JOB 1: THE BACKEND
  # ---------------------------------------------------
  deploy-backend:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Backend Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/
            docker compose -f docker-compose.backend.prod.yml pull
            docker compose -f docker-compose.backend.prod.yml down
            docker compose -f docker-compose.backend.prod.yml up -d
            docker image prune -f

  # ---------------------------------------------------
  # JOB 2: THE FRONTEND
  # ---------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Frontend Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FRONTEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/
            docker compose -f docker-compose.frontend.prod.yml pull
            docker compose -f docker-compose.frontend.prod.yml down
            docker compose -f docker-compose.frontend.prod.yml up -d
            docker image prune -f
